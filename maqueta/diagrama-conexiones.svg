<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" width="1200" height="1040" font-family="Segoe UI, Arial, sans-serif">
  <title>Diagrama de conexiones de la maqueta del Humedal Jaboque</title>
  <rect width="1200" height="1040" fill="#ffffff"/>

  <!-- ===== Título ===== -->
  <text x="40" y="48" font-size="28" font-weight="700" fill="#12241c">Maqueta del Humedal Jaboque: conexiones</text>
  <text x="40" y="76" font-size="15" fill="#4b5563">ESP32 DevKit V1 + sensor de turbidez + sensor TDS + pantalla OLED (opcional). Todo se alimenta por el USB del portátil.</text>

  <!-- ===== Leyenda de colores ===== -->
  <g font-size="14" fill="#12241c">
    <text x="40" y="120" font-weight="700">Colores de los cables</text>
    <line x1="40" y1="142" x2="80" y2="142" stroke="#e03131" stroke-width="5" stroke-linecap="round"/>
    <text x="90" y="147">5 V (VIN)</text>
    <line x1="40" y1="166" x2="80" y2="166" stroke="#f08c00" stroke-width="5" stroke-linecap="round"/>
    <text x="90" y="171">3,3 V (3V3)</text>
    <line x1="40" y1="190" x2="80" y2="190" stroke="#222222" stroke-width="5" stroke-linecap="round"/>
    <text x="90" y="195">Tierra (GND)</text>
    <line x1="200" y1="142" x2="240" y2="142" stroke="#c99700" stroke-width="5" stroke-linecap="round"/>
    <text x="250" y="147">Señal turbidez</text>
    <line x1="200" y1="166" x2="240" y2="166" stroke="#1c7ed6" stroke-width="5" stroke-linecap="round"/>
    <text x="250" y="171">Señal TDS</text>
    <line x1="200" y1="190" x2="240" y2="190" stroke="#2f9e44" stroke-width="5" stroke-linecap="round"/>
    <text x="250" y="195">Pantalla SDA</text>
    <line x1="200" y1="214" x2="240" y2="214" stroke="#7048e8" stroke-width="5" stroke-linecap="round"/>
    <text x="250" y="219">Pantalla SCL</text>
    <circle cx="60" cy="214" r="5" fill="#12241c"/>
    <text x="90" y="219">Unión soldada</text>
  </g>

  <!-- ===== Cables del sensor de turbidez (izquierda) ===== -->
  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Señal A → R1 (20 kΩ) → nodo → GPIO 34 -->
    <polyline points="300,470 340,470 340,250 495,250" stroke="#c99700"/>
    <!-- R2 (10 kΩ): del nodo a GND -->
    <polyline points="440,250 440,550" stroke="#222222"/>
    <!-- GND del sensor → GND izquierdo -->
    <polyline points="300,500 400,500 400,550 495,550" stroke="#222222"/>
    <!-- VCC → VIN (5 V) -->
    <polyline points="300,530 370,530 370,580 495,580" stroke="#e03131"/>
  </g>
  <!-- Resistencias del divisor -->
  <g font-size="14" font-weight="700" fill="#12241c">
    <rect x="331" y="330" width="18" height="70" rx="3" fill="#f3e3c2" stroke="#12241c" stroke-width="2"/>
    <text x="358" y="358" font-size="18">R1</text>
    <text x="358" y="376">20 kΩ</text>
    <rect x="431" y="370" width="18" height="70" rx="3" fill="#f3e3c2" stroke="#12241c" stroke-width="2"/>
    <text x="424" y="406" font-size="18" text-anchor="end">R2</text>
    <text x="424" y="424" text-anchor="end">10 kΩ</text>
  </g>
  <circle cx="440" cy="250" r="6" fill="#12241c"/>
  <circle cx="440" cy="550" r="6" fill="#12241c"/>
  <text x="320" y="300" font-size="13" fill="#4b5563" text-anchor="end">divisor de voltaje:</text>
  <text x="320" y="317" font-size="13" fill="#4b5563" text-anchor="end">baja 4,5 V a 1,5 V</text>
  <text x="320" y="340" font-size="13" fill="#4b5563" text-anchor="end">R1 (20 kΩ) va hacia el sensor,</text>
  <text x="320" y="357" font-size="13" fill="#4b5563" text-anchor="end">R2 (10 kΩ) va hacia GND</text>

  <!-- ===== Cables del sensor TDS (derecha) ===== -->
  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Señal A → GPIO 35, por encima de la placa; salta sobre el cable de turbidez -->
    <path d="M880,440 L740,440 L740,100 L470,100 L470,240 A10,10 0 0 1 470,260 L470,280 L495,280" stroke="#1c7ed6"/>
    <!-- − → GND derecho -->
    <polyline points="880,470 780,470 780,550 665,550" stroke="#222222"/>
    <!-- + → 3V3 -->
    <polyline points="880,500 800,500 800,580 665,580" stroke="#f08c00"/>
  </g>

  <!-- ===== ESP32 DevKit V1 (30 pines), visto desde arriba, antena arriba ===== -->
  <g>
    <rect x="480" y="120" width="200" height="520" rx="10" fill="#1f2937"/>
    <rect x="520" y="128" width="120" height="48" rx="4" fill="#374151"/>
    <text x="580" y="157" font-size="12" fill="#9ca3af" text-anchor="middle">antena</text>
    <text x="580" y="370" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">ESP32</text>
    <text x="580" y="392" font-size="13" fill="#d1d5db" text-anchor="middle">DevKit V1</text>
    <text x="580" y="410" font-size="13" fill="#d1d5db" text-anchor="middle">30 pines</text>
    <rect x="555" y="622" width="50" height="30" rx="4" fill="#9ca3af"/>
    <text x="580" y="642" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="700">USB</text>

    <!-- Pines izquierdos (de arriba a abajo) -->
    <g font-size="12" fill="#9ca3af">
      <circle cx="495" cy="160" r="5" fill="#6b7280"/><text x="506" y="164">EN</text>
      <circle cx="495" cy="190" r="5" fill="#6b7280"/><text x="506" y="194">VP</text>
      <circle cx="495" cy="220" r="5" fill="#6b7280"/><text x="506" y="224">VN</text>
      <circle cx="495" cy="250" r="7" fill="#c99700"/><text x="506" y="255" fill="#ffffff" font-weight="700" font-size="14">D34</text>
      <circle cx="495" cy="280" r="7" fill="#1c7ed6"/><text x="506" y="285" fill="#ffffff" font-weight="700" font-size="14">D35</text>
      <circle cx="495" cy="310" r="5" fill="#6b7280"/><text x="506" y="314">D32</text>
      <circle cx="495" cy="340" r="5" fill="#6b7280"/><text x="506" y="344">D33</text>
      <circle cx="495" cy="370" r="5" fill="#6b7280"/>
      <circle cx="495" cy="400" r="5" fill="#6b7280"/>
      <circle cx="495" cy="430" r="5" fill="#6b7280"/><text x="506" y="434">D27</text>
      <circle cx="495" cy="460" r="5" fill="#6b7280"/><text x="506" y="464">D14</text>
      <circle cx="495" cy="490" r="5" fill="#6b7280"/><text x="506" y="494">D12</text>
      <circle cx="495" cy="520" r="5" fill="#6b7280"/><text x="506" y="524">D13</text>
      <circle cx="495" cy="550" r="7" fill="#222222" stroke="#ffffff" stroke-width="1.5"/><text x="506" y="555" fill="#ffffff" font-weight="700" font-size="14">GND</text>
      <circle cx="495" cy="580" r="7" fill="#e03131"/><text x="506" y="585" fill="#ffffff" font-weight="700" font-size="14">VIN</text>
    </g>
    <!-- Pines derechos (de arriba a abajo) -->
    <g font-size="12" fill="#9ca3af" text-anchor="end">
      <circle cx="665" cy="160" r="5" fill="#6b7280"/><text x="654" y="164">D23</text>
      <circle cx="665" cy="190" r="7" fill="#7048e8"/><text x="654" y="195" fill="#ffffff" font-weight="700" font-size="14">D22</text>
      <circle cx="665" cy="220" r="5" fill="#6b7280"/><text x="654" y="224">TX0</text>
      <circle cx="665" cy="250" r="5" fill="#6b7280"/><text x="654" y="254">RX0</text>
      <circle cx="665" cy="280" r="7" fill="#2f9e44"/><text x="654" y="285" fill="#ffffff" font-weight="700" font-size="14">D21</text>
      <circle cx="665" cy="310" r="5" fill="#6b7280"/><text x="654" y="314">D19</text>
      <circle cx="665" cy="340" r="5" fill="#6b7280"/><text x="654" y="344">D18</text>
      <circle cx="665" cy="370" r="5" fill="#6b7280"/>
      <circle cx="665" cy="400" r="5" fill="#6b7280"/>
      <circle cx="665" cy="430" r="5" fill="#6b7280"/><text x="654" y="434">RX2</text>
      <circle cx="665" cy="460" r="5" fill="#6b7280"/><text x="654" y="464">D4</text>
      <circle cx="665" cy="490" r="5" fill="#6b7280"/><text x="654" y="494">D2</text>
      <circle cx="665" cy="520" r="5" fill="#6b7280"/><text x="654" y="524">D15</text>
      <circle cx="665" cy="550" r="7" fill="#222222" stroke="#ffffff" stroke-width="1.5"/><text x="654" y="555" fill="#ffffff" font-weight="700" font-size="14">GND</text>
      <circle cx="665" cy="580" r="7" fill="#f08c00"/><text x="654" y="585" fill="#ffffff" font-weight="700" font-size="14">3V3</text>
    </g>
  </g>

  <!-- ===== Módulo de turbidez ===== -->
  <g>
    <rect x="110" y="430" width="190" height="130" rx="8" fill="#eef6ff" stroke="#12241c" stroke-width="2"/>
    <text x="125" y="455" font-size="15" font-weight="700" fill="#12241c">Sensor de turbidez</text>
    <text x="125" y="474" font-size="12" fill="#4b5563">placa adaptadora</text>
    <text x="125" y="491" font-size="12" fill="#4b5563">(interruptor en "A")</text>
    <g font-size="13" font-weight="700" fill="#12241c" text-anchor="end">
      <circle cx="300" cy="470" r="6" fill="#c99700"/><text x="290" y="474">A</text>
      <circle cx="300" cy="500" r="6" fill="#222222"/><text x="290" y="504">GND</text>
      <circle cx="300" cy="530" r="6" fill="#e03131"/><text x="290" y="534">VCC</text>
    </g>
  </g>

  <!-- ===== Módulo TDS ===== -->
  <g>
    <rect x="880" y="410" width="190" height="160" rx="8" fill="#eef6ff" stroke="#12241c" stroke-width="2"/>
    <text x="900" y="535" font-size="15" font-weight="700" fill="#12241c">Sensor TDS</text>
    <text x="900" y="554" font-size="12" fill="#4b5563">placa Gravity</text>
    <g font-size="13" font-weight="700" fill="#12241c">
      <circle cx="880" cy="440" r="6" fill="#1c7ed6"/><text x="892" y="444">A</text>
      <circle cx="880" cy="470" r="6" fill="#222222"/><text x="892" y="474">−</text>
      <circle cx="880" cy="500" r="6" fill="#f08c00"/><text x="892" y="504">+</text>
    </g>
  </g>

  <!-- ===== USB al portátil ===== -->
  <line x1="580" y1="652" x2="580" y2="700" stroke="#6b7280" stroke-width="6"/>
  <rect x="470" y="700" width="220" height="44" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="580" y="719" font-size="14" font-weight="700" fill="#12241c" text-anchor="middle">Portátil (USB)</text>
  <text x="580" y="736" font-size="12" fill="#4b5563" text-anchor="middle">corriente + subir el programa</text>

  <!-- ===== Lago con las sondas ===== -->
  <path d="M60,780 L60,880 L1140,880 L1140,780" fill="none" stroke="#12241c" stroke-width="3"/>
  <rect x="62" y="800" width="1076" height="78" fill="#cfe8f7"/>
  <text x="600" y="866" font-size="14" fill="#1f5f8b" text-anchor="middle">Lago (recipiente con ~6 L de agua)</text>
  <!-- Cable y sonda de turbidez -->
  <polyline points="205,560 205,790" fill="none" stroke="#4b5563" stroke-width="3"/>
  <rect x="185" y="790" width="40" height="34" rx="4" fill="#4b5563"/>
  <text x="235" y="814" font-size="12" fill="#12241c">solo la punta</text>
  <text x="235" y="829" font-size="12" fill="#12241c">en el agua</text>
  <!-- Cable y sonda TDS -->
  <polyline points="975,570 975,790" fill="none" stroke="#4b5563" stroke-width="3"/>
  <rect x="967" y="790" width="16" height="50" rx="4" fill="#4b5563"/>
  <text x="993" y="814" font-size="12" fill="#12241c">sonda TDS</text>
  <!-- Separación -->
  <text x="600" y="773" font-size="12" fill="#4b5563" text-anchor="middle">sondas separadas unos 10 cm o más; la electrónica fuera del agua</text>

  <!-- ===== Pantalla OLED (opcional) ===== -->
  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- SCL: D22 → pantalla, salta sobre la señal del TDS -->
    <path d="M665,190 L730,190 A10,10 0 0 1 750,190 L760,190 L760,230 L880,230" stroke="#7048e8"/>
    <!-- SDA: D21 → pantalla -->
    <path d="M665,280 L730,280 A10,10 0 0 1 750,280 L780,280 L780,255 L880,255" stroke="#2f9e44"/>
    <!-- Alimentación: van a los mismos 3V3 y GND que el TDS -->
    <line x1="880" y1="180" x2="862" y2="180" stroke="#222222"/>
    <line x1="880" y1="205" x2="862" y2="205" stroke="#f08c00"/>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="806" y="171" width="56" height="18" rx="9" fill="#222222"/>
    <text x="834" y="184" fill="#ffffff">a GND</text>
    <rect x="806" y="196" width="56" height="18" rx="9" fill="#f08c00"/>
    <text x="834" y="209" fill="#ffffff">a 3V3</text>
  </g>
  <g>
    <rect x="880" y="150" width="190" height="175" rx="8" fill="#eef6ff" stroke="#12241c" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="935" y="162" width="122" height="66" rx="3" fill="#111827"/>
    <text x="943" y="178" font-size="9" fill="#e5e7eb" font-family="Consolas, monospace">Humedal Jaboque</text>
    <text x="943" y="197" font-size="13" fill="#e5e7eb" font-family="Consolas, monospace" font-weight="700">87.4 NTU</text>
    <rect x="937" y="212" width="118" height="13" fill="#e5e7eb"/>
    <text x="996" y="222" font-size="9" fill="#111827" font-family="Consolas, monospace" text-anchor="middle" font-weight="700">NIVEL CRITICO</text>
    <text x="900" y="292" font-size="14" font-weight="700" fill="#12241c">Pantalla OLED 0,96"</text>
    <text x="900" y="310" font-size="12" fill="#4b5563">SSD1306 · I2C · opcional</text>
    <g font-size="11" font-weight="700" fill="#12241c">
      <circle cx="880" cy="180" r="6" fill="#222222"/><text x="890" y="184">GND</text>
      <circle cx="880" cy="205" r="6" fill="#f08c00"/><text x="890" y="209">VCC</text>
      <circle cx="880" cy="230" r="6" fill="#7048e8"/><text x="890" y="234">SCL</text>
      <circle cx="880" cy="255" r="6" fill="#2f9e44"/><text x="890" y="259">SDA</text>
    </g>
  </g>

  <!-- ===== Notas ===== -->
  <g font-size="14" fill="#12241c">
    <text x="60" y="925" font-weight="700">Antes de conectar</text>
    <text x="60" y="951">• Guíate por el nombre impreso en cada pin: el orden cambia entre modelos de ESP32.</text>
    <text x="60" y="975">• Solo usa D34 y D35 para las señales: son entradas analógicas que funcionan con WiFi activo.</text>
    <text x="60" y="1023">• Conecta el USB al final, con todo revisado.</text>
    <text x="60" y="999">• El divisor (R1 de 20 kΩ y R2 de 10 kΩ) es obligatorio: sin él, el sensor de turbidez puede dañar el ESP32.</text>
    <text x="760" y="925" font-weight="700">Pantalla (opcional)</text>
    <text x="760" y="951">• Su VCC y GND van a los mismos 3V3 y GND que el</text>
    <text x="760" y="971">  sensor TDS: suelda una "Y" en cada cable.</text>
    <text x="760" y="991">• El orden de sus pines cambia entre marcas:</text>
    <text x="760" y="1007">  guíate por lo impreso en la pantalla.</text>
  </g>
</svg>
